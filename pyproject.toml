[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Schema-constrained LLM function calling"
readme = "README.md"
authors = [
    { name = "mel-asla" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.workspace]
members = ["llm_sdk"]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[tool.flake8]
exclude = [".venv", "llm_sdk"]
max-line-length = 88

[tool.mypy]
exclude = "(^llm_sdk/|^\\.venv/)"
